name: Build and Release Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install App Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: app
        run: flutter test

      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://phone-finder-api.onrender.com/api/v1
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Phone Finder v1.0.0 — Production Release"
          body: |
            ## Phone Finder — Android Client Release v1.0.0
            
            This release is configured to connect automatically to the live Render cloud backend:
            - **Backend URL**: `https://phone-finder-api.onrender.com/api/v1`
            - **Database**: Online Neon PostgreSQL
            - **Web Console**: OpenStreetMap + Leaflet Emergency Console
            
            ### Installation Instructions:
            1. Download `release.apk` below directly to your Android device (or download to PC and run `adb install release.apk`).
            2. Open the file to install.
            3. Follow the in-app onboarding to grant permissions (Location, Device Admin, Siren Audio) and save your high-entropy Emergency Recovery Key.
          files: app/build/app/outputs/flutter-apk/release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
