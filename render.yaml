services:
  - type: web
    name: phone-finder-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Phone Finder API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:AZUNRoB15Kz9OmHPY8vINnYms1xSCwNnVzvOJNX368g="
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-late-hill-b4oe9t3x.c-6.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_jZU2zdRm5ALq
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: RUN_MIGRATIONS
        value: "true"

  - type: web
    name: phone-finder-web
    runtime: node
    plan: free
    region: ohio
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_API_URL
        value: https://phone-finder-api.onrender.com
